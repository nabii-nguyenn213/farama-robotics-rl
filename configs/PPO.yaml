env:
  name: FetchReachDense-v4
  max_episode_steps: 0
  reward_scaler: 1.0
  flatten_obs: true
  kwargs: {}

train:
  run_name: PPO_${env.name}
  total_timesteps: 200000
  rollout_steps: 2048
  batch_size: 256
  n_epochs: 10
  gamma: 0.98
  gae_lambda: 0.95
  clip_range: 0.2
  entropy_coef: 0.0
  value_coef: 0.5
  max_grad_norm: 0.5
  optimizer:
    name: Adam
    actor_lr: 0.0003
    critic_lr: 0.0003
  show_tb: true
  device: auto
  hidden_size_actor: [256, 256]
  hidden_size_critic: [256, 256]
  seed: 42

eval:
  eval_every: 5000
  save_every: 5000
  log_every: 500
  eval_episode: 10

dir:
  root: .
  log: ${dir.root}/logs/log/${env.name}
  ckpt: ${dir.root}/results/checkpoints/${env.name}
  model: ${dir.root}/results/models/${env.name}
  best: ${dir.root}/results/best/${env.name}
  tensorboard: ${dir.root}/logs/tensorboard_logs/${env.name}
